[pytest]
asyncio_mode = auto
; --allow-hosts=127.0.0.1,::1 is required on Windows: asyncio's
; ProactorEventLoop emulates socket.socketpair() for its self-pipe via a
; real loopback TCP connection, which --disable-socket alone would block
; and break every async test. Any non-loopback connection (real
; Telegram/OpenAI/provider traffic) is still blocked and fails the test.
addopts = --disable-socket --allow-hosts=127.0.0.1,::1
