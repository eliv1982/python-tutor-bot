[pytest]
asyncio_mode = auto
; --allow-hosts=127.0.0.1,::1 is required on Windows: asyncio's
; ProactorEventLoop emulates socket.socketpair() for its self-pipe via a
; real loopback TCP connection, which --disable-socket alone would block
; and break every async test. Any non-loopback connection (real
; Telegram/OpenAI/provider traffic) is still blocked and fails the test.
addopts = --disable-socket --allow-hosts=127.0.0.1,::1
; Stage 6C corrective pass (independent-audit MAJOR 3): every real-thread
; concurrency test in this suite (tests/test_stage6c_lock_ordering.py,
; test_stage6c_oauth_generation_race.py, test_stage6c_session_issuance_race.py,
; etc.) is required to capture each worker's own result/exception under
; synchronization and assert on it explicitly — never to rely on a swallowed
; escaped exception merely producing a passing run. Promoting pytest's own
; PytestUnhandledThreadExceptionWarning (raised by its threadexception
; plugin whenever a spawned thread's target raises with nothing to catch
; it) to a hard error is the backstop: an exception that somehow still
; escapes a worker thread despite that requirement can never leave the
; suite green by merely being logged as a warning.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
