name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Stage 5C corrective pass (Blocker 3): PostgreSQL is provisioned
    # explicitly as a GitHub Actions workflow service — infrastructure
    # provisioning by the platform, distinct from the application/provider
    # network blockade pytest.ini enforces during the test run itself (see
    # the "Run tests" step below; --allow-hosts is unchanged and still
    # rejects everything except 127.0.0.1/::1). A pinned PostgreSQL 16
    # image (postgres:16-alpine — the same tag tests/conftest.py's local
    # disposable-container fallback uses) with an explicit health check;
    # bound to 127.0.0.1 (never `localhost`) on the standard port so it
    # lands inside pytest-socket's existing loopback allowlist exactly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: pytest
          POSTGRES_DB: pytest_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U pytest -d pytest_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s

    env:
      # tests/conftest.py's postgres_container() fixture uses this DSN
      # directly (its highest-priority path) instead of trying to start
      # its own local Docker container — see that fixture's own docstring.
      TEST_POSTGRES_DSN: postgresql+psycopg://pytest:pytest@127.0.0.1:5432/pytest_ci
      # Makes a missing/unreachable/misconfigured PostgreSQL service a
      # hard test FAILURE rather than a silent pytest.skip() — this is
      # what makes it impossible for the Stage 5C PostgreSQL proof to
      # quietly disappear from CI. See tests/conftest.py's
      # REQUIRE_POSTGRES_ENV / _unavailable().
      PYTEST_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for dependency conflicts
        run: python -m pip check

      - name: Run tests (offline-enforced; PostgreSQL required, never silently skipped)
        run: python -m pytest

  # Stage 7B-1: the React/TypeScript frontend (frontend/). Independent of
  # the Python job above — no PostgreSQL, no provider access, no network
  # beyond the npm registry for `npm ci`. Tests never call a real backend
  # or provider (fetch is stubbed).
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact, from the committed lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
