[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# No sqlalchemy.url here deliberately — alembic/env.py sets it at runtime
# from db.settings.DATABASE_URL, so both `alembic upgrade head` and the
# Docker-Postgres test fixture's programmatic alembic.command.upgrade()
# (against a dynamically assigned container port) use the SAME resolution
# path, never a value hardcoded in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
